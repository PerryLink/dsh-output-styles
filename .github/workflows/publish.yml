name: Publish

on:
  push:
    tags: ['v*']

permissions:
  id-token: write # npm provenance attestation
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `npm publish` below also runs the prepublishOnly gate, which repeats
      # this verification — the duplication is deliberate: a failed publish
      # must never ship untested code, and the explicit step keeps the
      # failure visible in the run log.
      - name: Verify (typecheck + tests + self-contained)
        run: pnpm run verify

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # A tag push without the secret, or for a version already on the
        # registry (e.g. published manually before the tag), skips the publish
        # instead of failing the release tag. (The guard lives in bash because
        # GitHub rejects the secrets context in step-level `if` expressions.)
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN secret is not set; skipping npm publish"
            exit 0
          fi
          if npm view "dsh-output-styles@${version}" version >/dev/null 2>&1; then
            echo "dsh-output-styles@${version} is already published; skipping npm publish"
          else
            npm publish --provenance
          fi
