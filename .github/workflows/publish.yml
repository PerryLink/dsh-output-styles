name: Publish

on:
  push:
    tags: ['v*']

permissions:
  id-token: write # npm provenance attestation
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `npm publish` below also runs the prepublishOnly gate, which repeats
      # this verification — the duplication is deliberate: a failed publish
      # must never ship untested code, and the explicit step keeps the
      # failure visible in the run log.
      - name: Verify (typecheck + tests + self-contained)
        run: pnpm run verify

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # A tag push without the secret, or for a version already on the
        # registry (e.g. published manually before the tag), no longer skips
        # silently: a release that published nothing used to go green, and it
        # now fails loudly instead. A version already on the registry still
        # skips (idempotent re-runs). (The guard lives in bash because
        # GitHub rejects the secrets context in step-level `if` expressions.)
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set; refusing to report a release that published nothing"
            exit 1
          fi
          if npm view "dsh-output-styles@${version}" version >/dev/null 2>&1; then
            echo "dsh-output-styles@${version} is already published; skipping npm publish"
          else
            npm publish --provenance
          fi

      - name: Verify the version is live on the registry
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            if npm view "dsh-output-styles@${version}" version >/dev/null 2>&1; then
              echo "dsh-output-styles@${version} is live on the registry"
              exit 0
            fi
            echo "attempt ${attempt}: not visible on the registry yet; retrying"
            sleep 5
          done
          echo "::error::dsh-output-styles@${version} is not on the registry after the publish step"
          exit 1

  # npm publish alone left every release without a GitHub Release page (v0.6.15
  # had to be created by hand after the fact). This job closes that gap and is
  # idempotent, so re-running a tag is safe.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub Release from the CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists; skipping"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          # A CHANGELOG missing this version's section must not fail the job:
          # npm has already published by now, and a missing Release page is
          # exactly the gap this job exists to close. Fall back to generated
          # notes instead of going red.
          node scripts/changelog-section.mjs "$VERSION" > release-notes.md || true
          if [ -s release-notes.md ]; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file release-notes.md
          else
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
